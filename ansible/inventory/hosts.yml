        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o ProxyCommand="ssh -i ~/.ssh/coursework_ed25519 -o StrictHostKeyChecking=no -W %h:%p ubuntu@51.250.4.123"

    elasticsearch:
      hosts:
        elasticsearch-server:
          ansible_host: 10.0.1.14
