---
- name: Установить необходимые пакеты
  ansible.builtin.apt:
    name:
      - wget
      - tar
    state: present
    update_cache: true

- name: Создать пользователя nginx_log_exporter
  ansible.builtin.user:
    name: "{{ nginx_log_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Добавить пользователя в группу adm (доступ к /var/log/nginx)
  ansible.builtin.user:
    name: "{{ nginx_log_exporter_user }}"
    groups: adm
    append: true

- name: Скачать архив prometheus-nginxlog-exporter
  ansible.builtin.get_url:
    url: "https://github.com/martin-helmich/prometheus-nginxlog-exporter/releases/download/v{{ nginx_log_exporter_version }}/prometheus-nginxlog-exporter_{{ nginx_log_exporter_version }}_linux_amd64.tar.gz"
    dest: "/tmp/nginx-log-exporter-{{ nginx_log_exporter_version }}.tar.gz"
    mode: "0644"

- name: Распаковать архив
  ansible.builtin.unarchive:
    src: "/tmp/nginx-log-exporter-{{ nginx_log_exporter_version }}.tar.gz"
    dest: "/tmp"
    remote_src: true
    creates: "/tmp/prometheus-nginxlog-exporter"

- name: Установить бинарный файл
  ansible.builtin.copy:
    src: "/tmp/prometheus-nginxlog-exporter"
    dest: "/usr/local/bin/nginx-log-exporter"
    owner: "{{ nginx_log_exporter_user }}"
    group: "{{ nginx_log_exporter_user }}"
    mode: "0755"
    remote_src: true
  notify: Перезапустить nginx_log_exporter

- name: Создать директорию для конфига
  ansible.builtin.file:
    path: /etc/nginx_log_exporter
    state: directory
    mode: "0755"

- name: Развернуть конфиг экспортера
  ansible.builtin.template:
    src: config.hcl.j2
    dest: /etc/nginx_log_exporter/config.hcl
    mode: "0644"
  notify: Перезапустить nginx_log_exporter

- name: Создать systemd unit
  ansible.builtin.template:
    src: nginx_log_exporter.service.j2
    dest: /etc/systemd/system/nginx_log_exporter.service
    mode: "0644"
  notify:
    - Перезагрузить systemd
    - Перезапустить nginx_log_exporter

- name: Включить и запустить nginx_log_exporter
  ansible.builtin.systemd:
    name: nginx_log_exporter
    state: started
    enabled: true
    daemon_reload: true